<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111410">
  <meta name="description" content="FitCheck is your private gym, nutrition and progress tracker.">
  <title>FitCheck | Your fitness, in focus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23c6f36b'/%3E%3Cpath d='M25 24h50v13H40v10h29v13H40v16H25z' fill='%23111410'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="FitCheck home" data-page="dashboard">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span>fit<span class="brand-light">check</span></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">◫</span><span>Overview</span></button>
        <button class="nav-link" data-page="workouts"><span class="nav-icon">↗</span><span>Workouts</span></button>
        <button class="nav-link" data-page="nutrition"><span class="nav-icon">◉</span><span>Nutrition</span></button>
        <button class="nav-link" data-page="progress"><span class="nav-icon">⌁</span><span>Progress</span></button>
        <button class="nav-link" data-page="reminders"><span class="nav-icon">◷</span><span>Reminders</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-card">
          <span class="privacy-icon">⌑</span>
          <div><strong>Your data stays yours</strong><p>Saved privately in this browser.</p></div>
        </div>
        <button class="nav-link settings-link" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        <div class="profile-mini">
          <div class="avatar" id="avatar-initial">F</div>
          <div class="profile-mini-copy"><strong id="profile-name-mini">Your profile</strong><span>Personal space</span></div>
          <button class="icon-button mini-edit" data-page="settings" aria-label="Edit profile">⋯</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menu-toggle" aria-label="Open menu">☰</button>
        <div class="breadcrumb"><span>FITCHECK</span><i>/</i><strong id="crumb-current">Overview</strong></div>
        <div class="topbar-right">
          <span class="today-pill"><span class="live-dot"></span><span id="today-label">Today</span></span>
          <button class="top-avatar" data-page="settings" id="top-avatar" aria-label="Open settings">F</button>
        </div>
      </header>
      <section class="page-content" id="view-root" aria-live="polite"></section>
      <footer class="footer"><span>FITCHECK <b>•</b> YOUR PERSONAL FITNESS SPACE</span><span>Built for consistency, not perfection.</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">QUICK ADD</span><h2 id="modal-title">Add entry</h2></div><button class="icon-button close-modal" id="modal-close" aria-label="Close">×</button></div>
      <div id="modal-body"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
