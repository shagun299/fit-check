<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111410">
  <meta name="description" content="FitCheck is your private gym, nutrition and progress tracker.">
  <title>FitCheck | Your fitness, in focus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#" aria-label="FitCheck home" data-page="dashboard">
          <img class="brand-symbol" src="logo.svg" alt="">
          <span class="brand-copy"><strong>Fit<span class="brand-light">Check</span></strong><small>TRACK · TRAIN · TRANSFORM</small></span>
        </a>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close workspace">×</button>
      </div>
      <div class="side-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">◫</span><span>Overview</span></button>
        <button class="nav-link" data-page="workouts"><span class="nav-icon">↗</span><span>Workouts</span></button>
        <button class="nav-link" data-page="nutrition"><span class="nav-icon">◉</span><span>Nutrition</span></button>
        <button class="nav-link" data-page="progress"><span class="nav-icon">⌁</span><span>Progress</span></button>
        <button class="nav-link" data-page="reminders"><span class="nav-icon">◷</span><span>Reminders</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-card">
          <span class="privacy-icon">⌑</span>
          <div><strong>Your data stays yours</strong><p>Private Google sync, when connected.</p></div>
        </div>
        <button class="nav-link settings-link" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        <div class="profile-mini">
          <div class="avatar" id="avatar-initial">F</div>
          <div class="profile-mini-copy"><strong id="profile-name-mini">Your profile</strong><span>Personal space</span></div>
          <button class="icon-button mini-edit" data-page="settings" aria-label="Edit profile">⋯</button>
        </div>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="Close workspace" hidden></button>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" id="menu-toggle" type="button" aria-label="Open workspace" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="breadcrumb"><span>FITCHECK</span><i>/</i><strong id="crumb-current">Overview</strong></div>
        <div class="topbar-right">
          <span class="today-pill"><span class="live-dot"></span><span id="today-label">Today</span></span>
          <button class="cloud-top-btn" id="cloud-top-btn" data-cloud-action="login" type="button">Connect Google</button><button class="icon-button theme-toggle" id="theme-toggle" aria-label="Switch theme" title="Switch theme">☼</button>
          <button class="top-avatar" data-page="settings" id="top-avatar" aria-label="Open settings">F</button>
        </div>
      </header>
      <section class="page-content" id="view-root" aria-live="polite"></section>
      <footer class="footer"><span>FITCHECK <b>•</b> YOUR PERSONAL FITNESS SPACE</span><span>Built for consistency, not perfection.</span></footer>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation"><button data-page="dashboard"><span>◫</span>Home</button><button data-page="workouts"><span>↗</span>Train</button><button data-page="nutrition"><span>◉</span>Food</button><button data-page="progress"><span>⌁</span>Progress</button><button data-page="reminders"><span>◷</span>Remind</button></nav>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">QUICK ADD</span><h2 id="modal-title">Add entry</h2></div><button class="icon-button close-modal" id="modal-close" aria-label="Close">×</button></div>
      <div id="modal-body"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="food-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud-sync.js"></script>
</body>
</html>
